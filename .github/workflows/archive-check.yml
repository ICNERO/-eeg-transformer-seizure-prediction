name: Archive checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install notebook validator
        run: python -m pip install nbformat
      - name: Verify archive
        run: python tools/verify_archive.py
